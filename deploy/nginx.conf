# ==========================================================
# منصة رِفاد — إعداد Nginx كوكيل عكسي
# ----------------------------------------------------------
# يستقبل الطلبات على المنفذ 80/443 ويوجّهها إلى تطبيق Next.js.
# يعمل داخل حاوية nginx (خدمة app على المنفذ 3000).
# ==========================================================

# معدل الطلبات لحماية صفحة الدخول من التخمين.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream rifad_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # شهادة Let's Encrypt تُدار عبر certbot على الخادم المضيف.
    # عند تفعيل HTTPS أزل التعليق عن إعادة التوجيه أدناه.
    # return 301 https://$host$request_uri;

    client_max_body_size 30m;   # استيراد Excel وقاعدة الحجم 25 ميجابايت

    # ترويسات أساسية
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    # الملفات الثابتة: كاش طويل (أسماؤها تحتوي بصمة التغيير)
    location /_next/static/ {
        proxy_pass http://rifad_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://rifad_app;
        add_header Cache-Control "public, max-age=2592000";
    }

    # حماية صفحة الدخول من المحاولات المتكررة
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://rifad_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://rifad_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

